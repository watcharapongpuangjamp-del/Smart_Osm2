name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant (debug or release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create .env file for build
        # สร้างไฟล์ .env จำลองสำหรับให้ระบบ Build ผ่าน 
        # (หากไม่มีไฟล์นี้ ระบบอาจจะหาตัวแปร MAPS_API_KEY ไม่เจอและ Error)
        run: |
          cat > .env << 'EOF'
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'dummy_maps_key' }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'dummy_gemini_key' }}
          EOF

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --stacktrace
        env:
          # ตัวแปรเหล่านี้จำเป็นสำหรับการ Build Release ที่มีการ Sign APK
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
