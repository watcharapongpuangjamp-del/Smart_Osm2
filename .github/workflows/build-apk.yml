name: Build APK

on:
  push:
    branches:
      - main
      - develop
      - 'repair/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Create .env.ci with safe defaults for CI builds
      # This prevents empty placeholder issues in Manifest
      - name: Create .env file for CI
        run: |
          cat > .env << 'EOF'
          # CI Build Environment Configuration
          # These are placeholders for CI builds without real secrets
          MAPS_API_KEY=placeholder_maps_api_key_ci_build
          FIREBASE_APPCHECK_DEBUG_TOKEN=placeholder_token
          EOF
          echo "✓ Created .env with CI-safe defaults"

      - name: Create debug keystore
        run: |
          mkdir -p ${{ github.workspace }}
          keytool -genkey -v -keystore ${{ github.workspace }}/debug.keystore \
            -keyalg RSA -keysize 2048 \
            -validity 10000 -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "✓ Debug keystore created"

      # Run tests BEFORE build. Test failures must fail CI.
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          ./gradlew testDebugUnitTest \
            --stacktrace \
            --info 2>&1 | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "test_exit_code=$TEST_EXIT_CODE" >> "$GITHUB_ENV"
          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "❌ Unit tests failed"
            exit "$TEST_EXIT_CODE"
          fi
          echo "✓ All unit tests passed"
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug \
            --stacktrace \
            --info 2>&1 | tee build-output.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "❌ Build failed - see logs above"
            exit 1
          fi
          echo "✓ Debug APK built successfully"
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          MAPS_API_KEY: placeholder_maps_api_key_ci_build

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        run: |
          echo "Building Release APK..."
          ./gradlew assembleRelease \
            --stacktrace \
            --info 2>&1 | tee build-output.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "❌ Release build failed - see logs above"
            exit 1
          fi
          echo "✓ Release APK built successfully"
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: placeholder_maps_api_key_ci_build

      - name: Upload Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/
            build-output.log
            test-output.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Print Build Status
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
